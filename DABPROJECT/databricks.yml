# This is a Declarative Automation Bundle definition for DABPROJECT.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DABPROJECT
  uuid: 2d58f4bd-62ae-4b29-b241-40946ba8e216

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-27468302-2b81.cloud.databricks.com/
    variables:
      catalog: ${var.catalog_name}
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-27468302-2b81.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/nikhileshwar316@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nikhileshwar316@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.catalog_name}
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
